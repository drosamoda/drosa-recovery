<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>D'Rosa CRM — Operação WhatsApp</title>
  <link rel="stylesheet" href="/crm-v2-assets/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand"><span class="brand-mark">DR</span><strong>D&rsquo;Rosa</strong><span class="brand-sub">CRM</span></div>
        <nav id="groupNav" class="group-nav"></nav>
      </div>
      <div class="topbar-right">
        <span id="connection" class="connection-state">Desconectado</span>
        <div class="auth-control">
          <input id="secret" type="password" placeholder="Segredo de leitura" autocomplete="off">
          <button id="connect" class="btn btn-primary">Conectar</button>
          <button id="disconnect" class="btn btn-ghost" type="button">Sair</button>
        </div>
      </div>
    </header>

    <nav id="subNav" class="sub-nav"></nav>

    <main class="main">
      <div class="page-head">
        <p id="pageEyebrow" class="eyebrow">OPERAÇÃO WHATSAPP</p>
        <div class="page-head-row">
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageSubtitle">O que está acontecendo agora.</p>
          </div>
          <div id="toolbar" class="toolbar"></div>
        </div>
      </div>

      <div id="content" class="content">
        <div class="gate">
          <h2>Conectar ao CRM</h2>
          <p>Informe o segredo de leitura para consultar os dados operacionais. Este acesso é somente leitura — nenhuma ação de envio ou alteração fica disponível aqui.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="panel" class="side-panel hidden">
    <div class="side-panel-inner">
      <button id="closePanel" class="panel-close" aria-label="Fechar">✕</button>
      <div id="panelContent"></div>
    </div>
  </div>
  <div id="backdrop" class="backdrop hidden"></div>

  <script src="/crm-v2-assets/app.js"></script>
</body>
</html>
